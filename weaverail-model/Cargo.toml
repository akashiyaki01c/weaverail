[package]
name = "weaverail-model"
version.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.22.0", features = ["serde", "v4"] }
ts-rs = { version = "12.0", features = ["serde-json-impl", "uuid-impl", "indexmap-impl"] }
ron = "0.12.1"
zstd = "0.13.3"
base64 = "0.22.1"
strum = { version = "0.27", features = ["strum_macros", "derive"] }
weaverail-object = { path = "../weaverail-object" }
thiserror = "2.0.18"
smallvec = "1.15.1"
rustc-hash = "2.1.2"
indexmap = { version = "2.14.0", features = ["serde"] }
