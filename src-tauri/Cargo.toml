[package]
name = "weaverail"
version.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "weaverail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
weaverail-model = { path = "../weaverail-model" }
weaverail-operation = { path = "../weaverail-operation" }
weaverail-testdata = { path = "../weaverail-testdata" }
weft-rail = { path = "../weft-rail" }
warp-rail = { path = "../warp-rail" }
indexmap = { version = "2.14.0", features = ["serde"] }
tauri-specta = { version = "2.0.0-rc", features = ["typescript"] }
specta = { version = "1.0.5", features = ["functions"] }
